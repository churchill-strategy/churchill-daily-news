name: Build briefing index
on:
  push:
    branches: [main]
    paths: ['daily/**', 'scripts/build_index.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefing-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_index.py
      - name: Commit index.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet -- index.json; then echo "No change"; exit 0; fi
          # The timestamp alone is not a change worth committing
          if [ "$(git diff --cached -- index.json | grep '^[+-] ' | grep -v '"updated"' | wc -l)" = "0" ]; then echo "Only the timestamp changed"; exit 0; fi
          git commit -m "Update briefing index"
          git pull --rebase origin main
          git push
